<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche Sales Dashboard</title>
    <!-- Google Fonts & Chart.js CDN -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-principal: #111111;
            --bg-card: #1a1a1a;
            --bg-input: #262626;
            --porsche-red: #D5001C;
            --text-main: #FFFFFF;
            --text-muted: #A3A3A3;
            --border-color: #2D2D2D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--porsche-red);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--porsche-red);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Container de Filtros */
        .filters-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            background-color: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-group select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--porsche-red);
        }

        /* Grid de KPIs */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--porsche-red);
        }

        .kpi-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Grid de Gráficos */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 8px;
            min-height: 380px;
        }

        .chart-card.full-width {
            grid-column: span 2;
        }

        .chart-card h3 {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .chart-card.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>PORSCHE <span>BI</span></h1>
            <p class="subtitle">Performance & Sales Analytics Dashboard</p>
        </div>
        <div style="text-align: right">
            <p style="font-size: 0.85rem; color: var(--text-muted)">Base Sanitizada</p>
            <p style="font-weight: 600; font-size: 0.9rem;">100 Registros</p>
        </div>
    </header>

    <!-- Seção de Filtros -->
    <div class="filters-container">
        <div class="filter-group">
            <label for="filter-modelo">Modelo</label>
            <select id="filter-modelo" onchange="updateDashboard()">
                <option value="ALL">Todos os Modelos</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filter-estado">Estado</label>
            <select id="filter-estado" onchange="updateDashboard()">
                <option value="ALL">Todos os Estados</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filter-pagamento">Forma de Pagamento</label>
            <select id="filter-pagamento" onchange="updateDashboard()">
                <option value="ALL">Todas as Formas</option>
            </select>
        </div>
    </div>

    <!-- Seção de Indicadores (KPIs) -->
    <div class="kpi-container">
        <div class="kpi-card">
            <p class="kpi-title">Receita Total</p>
            <p class="kpi-value" id="kpi-receita">$0.00</p>
        </div>
        <div class="kpi-card">
            <p class="kpi-title">Unidades Vendidas</p>
            <p class="kpi-value" id="kpi-vendas">0</p>
        </div>
        <div class="kpi-card">
            <p class="kpi-title">Ticket Médio</p>
            <p class="kpi-value" id="kpi-ticket">$0.00</p>
        </div>
    </div>

    <!-- Painel de Gráficos -->
    <div class="charts-grid">
        <div class="chart-card full-width">
            <h3>Receita Acumulada por Modelo de Veículo</h3>
            <div class="chart-container">
                <canvas id="chartModelo"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>Preço Médio Praticado por Estado</h3>
            <div class="chart-container">
                <canvas id="chartEstado"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>Representatividade por Método de Pagamento</h3>
            <div class="chart-container">
                <canvas id="chartPagamento"></canvas>
            </div>
        </div>
    </div>
